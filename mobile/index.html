<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Citropy</title>
  <script type="module" src="./src/main.ts"></script>
</head>

<body data-page="connect">
  <main class="screen">
    <img class="screen-logo" src="/citropy.svg" alt="" />
    <section data-screen="connect" hidden>
      <h1>Connect to your computer</h1>
      <p>On your computer, open Citropy, go to Settings &gt; Phone access, and scan the code shown there.</p>
      <button class="screen-button" type="button" data-action="scan">Scan code</button>
      <form class="screen-paste" data-paste>
        <input name="link" type="url" placeholder="Or paste the pairing link" autocomplete="off" required />
        <button class="screen-button" data-variant="quiet" type="submit">Connect</button>
      </form>
    </section>
    <section data-screen="update" hidden>
      <h1>Citropy <span data-version></span> is available</h1>
      <p>Download it, then open the file to install. Your chats stay on your computer.</p>
      <a class="screen-button" data-action="update">Download update</a>
      <button class="screen-button" data-variant="quiet" type="button" data-action="later">Not now</button>
    </section>
    <p class="screen-error" data-error hidden></p>
  </main>
</body>

</html>
