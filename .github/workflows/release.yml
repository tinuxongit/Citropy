name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Releases must run from main."; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const next = process.env.VERSION; if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(next)) throw new Error(`Version must look like 0.2.0, got ${next}`); const current = JSON.parse(fs.readFileSync("package.json", "utf8")).version; const compare = (left, right) => { const a = left.split(".").map(Number); const b = right.split(".").map(Number); return a[0] - b[0] || a[1] - b[1] || a[2] - b[2]; }; if (compare(next, current) <= 0) throw new Error(`Version ${next} must be greater than ${current}`);'
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
      - run: npm ci
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/latest-linux.yml

  mac:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Set version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Package the macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:package -- --mac
      - run: test -f release/latest-mac.yml
      - uses: actions/upload-artifact@v7
        with:
          name: mac-release
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*.zip
            release/latest-mac.yml

  windows:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Set version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version
      - name: Package the Windows app
        run: npm run desktop:package -- --win
      - run: |
          if (-not (Test-Path release/latest.yml)) { throw "latest.yml is missing." }
          if (-not (Get-ChildItem release/*.exe.blockmap)) { throw "The installer blockmap is missing." }
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          compression-level: 0
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  publish:
    needs: [validate, linux, mac, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: ls -l dist
      - name: Checksum release files
        working-directory: dist
        run: |
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
      - name: Commit version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git tag "v$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$VERSION"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" dist/SHA256SUMS dist/*.AppImage dist/latest-linux.yml dist/*.zip dist/latest-mac.yml dist/*.exe dist/*.exe.blockmap dist/latest.yml --verify-tag --draft --title "Citropy $VERSION" --generate-notes
