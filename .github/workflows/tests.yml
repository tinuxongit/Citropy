name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2
      - run: npm ci
      - run: npm run setup:desktop
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - name: Check the installer scripts
        run: |
          sh -n scripts/install.sh
          sh -n desktop/apply-appimage-update.sh
          shellcheck -s sh scripts/install.sh desktop/apply-appimage-update.sh
          pwsh -NoProfile -Command '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }'
      - run: npm test
