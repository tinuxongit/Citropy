name: Back up the Android key

# One-time workflow. Encrypts the signing keystore and its password to a
# certificate whose private key stays on the maintainer's machine.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Encrypt the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CITROPY_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CITROPY_ANDROID_KEYSTORE_PASSWORD }}
          CERT: |
