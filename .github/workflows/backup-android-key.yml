        run: |
          umask 077
          mkdir "$RUNNER_TEMP/key" out
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key/citropy.keystore"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/key/password.txt"
          sha256sum "$RUNNER_TEMP/key/citropy.keystore" | cut -d' ' -f1
          printf '%s' "$CERT" > cert.pem
          tar -C "$RUNNER_TEMP/key" -cf - citropy.keystore password.txt | openssl cms -encrypt -binary -aes-256-cbc -outform DER -out out/android-key.p7m cert.pem
          rm -rf "$RUNNER_TEMP/key"
      - uses: actions/upload-artifact@v7
        with:
          name: android-key
          retention-days: 1
          if-no-files-found: error
          path: out/android-key.p7m
